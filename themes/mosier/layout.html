<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{descriptionTag}}
{{indexing}}
<meta property="og:title" content="{{title}}">
<meta property="og:type" content="website">
<link rel="preload" href="/fonts/lato-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/handlee.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page-{{slug}}">
<a class="skip-link" href="#main">Skip to content</a>
<header class="masthead">
<div class="logobar"><a class="brand" href="/">{{> logo}}</a></div>
<div class="navbar">
<nav class="site-nav" aria-label="Main">{{nav}}</nav>
<details class="mobile-nav">
<summary aria-label="Menu"><span class="burger"></span></summary>
<nav aria-label="Main, mobile">{{nav}}</nav>
</details>
</div>
</header>
<main id="main">
{{body}}
</main>
</body>
</html>
